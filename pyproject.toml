[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-outpaint-studio"
version = "0.6.4"
description = "Desktop studio for AI image outpainting — extend any canvas beyond its frame with diffusion-guided fill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ai-outpaint-studio contributors" }]
keywords = ["outpainting", "diffusion", "image-generation", "canvas-extension", "stable-diffusion"]

dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "diffusers>=0.30.0",
    "transformers>=4.42.0",
    "accelerate>=0.31.0",
    "safetensors>=0.4.3",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "loguru>=0.7.2",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.scripts]
outpaint = "ai_outpaint_studio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"